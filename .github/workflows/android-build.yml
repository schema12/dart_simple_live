name: android-build

# Android APK 云构建：手动触发（workflow_dispatch），支持 debug/release 与架构选择。
# - Web 客户端在本工作流内构建并写入 simple_live_app/assets/web；
# - 原项目 release 签名缺 key.properties 时自动回退 debug 签名；
# - 产物上传为 Artifact（apk + sha256 + 构建日志）。
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      target_abi:
        description: '目标 CPU 架构'
        required: true
        default: 'arm64-v8a'
        type: choice
        options:
          - arm64-v8a
          - universal
      run_flutter_tests:
        description: '构建前运行 Flutter 测试（simple_live_app）'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      # ---------- Web 客户端 ----------
      - name: Build web client
        working-directory: web_client
        run: |
          npm ci
          npm run typecheck
          npm run build
          ls -la ../simple_live_app/assets/web

      # ---------- Flutter ----------
      - name: Flutter pub get
        working-directory: simple_live_app
        run: flutter pub get

      - name: Flutter tests
        if: ${{ inputs.run_flutter_tests }}
        working-directory: simple_live_app
        run: flutter test

      # ---------- APK ----------
      - name: Build APK (debug / arm64)
        if: ${{ inputs.build_type == 'debug' && inputs.target_abi == 'arm64-v8a' }}
        working-directory: simple_live_app
        run: |
          set -o pipefail
          flutter build apk --debug --target-platform android-arm64 2>&1 | tee build.log

      - name: Build APK (debug / universal)
        if: ${{ inputs.build_type == 'debug' && inputs.target_abi == 'universal' }}
        working-directory: simple_live_app
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee build.log

      - name: Build APK (release / arm64)
        if: ${{ inputs.build_type == 'release' && inputs.target_abi == 'arm64-v8a' }}
        working-directory: simple_live_app
        run: |
          set -o pipefail
          flutter build apk --release --target-platform android-arm64 2>&1 | tee build.log

      - name: Build APK (release / universal)
        if: ${{ inputs.build_type == 'release' && inputs.target_abi == 'universal' }}
        working-directory: simple_live_app
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log

      # ---------- 产物 ----------
      - name: Collect artifacts
        run: |
          mkdir -p dist
          APK=$(ls simple_live_app/build/app/outputs/flutter-apk/*.apk | head -1)
          TYPE=${{ inputs.build_type }}
          if [ "$TYPE" = "debug" ]; then
            cp "$APK" dist/android-debug.apk
            NAME=android-debug.apk
          else
            cp "$APK" dist/android-release.apk
            NAME=android-release.apk
          fi
          cp simple_live_app/build.log dist/build.log 2>/dev/null || true
          (cd dist && sha256sum "$NAME" > sha256.txt)
          ls -la dist
          cat dist/sha256.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ inputs.build_type }}-${{ inputs.target_abi }}
          path: |
            dist/*.apk
            dist/sha256.txt
            dist/build.log
          retention-days: 14
          if-no-files-found: error
