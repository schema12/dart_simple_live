name: android-build

# Android APK 云构建：手动触发（workflow_dispatch），支持 debug/release 与架构选择。
# - Web 客户端在本工作流内构建并写入 simple_live_app/assets/web；
# - 原项目 release 签名缺 key.properties 时自动回退 debug 签名；
# - 产物上传为 Artifact（apk + sha256 + 构建日志）。
on:
  # 仅当工作流文件自身变更时自动构建（用于配置校验）；日常构建用 workflow_dispatch
  push:
    branches:
      - lan-server-dev
    paths:
      - '.github/workflows/android-build.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      target_abi:
        description: '目标 CPU 架构'
        required: true
        default: 'arm64-v8a'
        type: choice
        options:
          - arm64-v8a
          - universal
      run_flutter_tests:
        description: '构建前运行 Flutter 测试（simple_live_app）'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Resolve build parameters
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build_type=${{ inputs.build_type }}" >> "$GITHUB_OUTPUT"
            echo "target_abi=${{ inputs.target_abi }}" >> "$GITHUB_OUTPUT"
            echo "run_tests=${{ inputs.run_flutter_tests }}" >> "$GITHUB_OUTPUT"
          else
            # push 触发（工作流配置变更）：默认 debug / arm64，跑测试
            echo "build_type=debug" >> "$GITHUB_OUTPUT"
            echo "target_abi=arm64-v8a" >> "$GITHUB_OUTPUT"
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      # ---------- Web 客户端 ----------
      - name: Build web client
        working-directory: web_client
        run: |
          npm ci
          npm run typecheck
          npm run build
          ls -la ../simple_live_app/assets/web

      # ---------- Flutter ----------
      - name: Flutter pub get
        working-directory: simple_live_app
        run: flutter pub get

      - name: Flutter tests
        if: ${{ steps.resolve.outputs.run_tests == 'true' }}
        working-directory: simple_live_app
        run: flutter test

      # ---------- APK ----------
      - name: Setup release signing (from Secrets)
        if: ${{ steps.resolve.outputs.build_type == 'release' }}
        working-directory: simple_live_app
        env:
          LAN_KEYSTORE_BASE64: ${{ secrets.LAN_KEYSTORE_BASE64 }}
          LAN_KEYSTORE_PASSWORD: ${{ secrets.LAN_KEYSTORE_PASSWORD }}
          LAN_KEY_ALIAS: ${{ secrets.LAN_KEY_ALIAS }}
          LAN_KEY_PASSWORD: ${{ secrets.LAN_KEY_PASSWORD }}
        run: |
          if [ -z "$LAN_KEYSTORE_BASE64" ]; then
            echo "!! 未配置签名 Secrets，release 将回退 debug 签名"
            exit 0
          fi
          echo "$LAN_KEYSTORE_BASE64" | base64 -d > android/release-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=../release-keystore.jks
          storePassword=$LAN_KEYSTORE_PASSWORD
          keyAlias=$LAN_KEY_ALIAS
          keyPassword=$LAN_KEY_PASSWORD
          EOF
          ls -la android/release-keystore.jks android/key.properties

      - name: Build APK (debug / arm64)
        if: ${{ steps.resolve.outputs.build_type == 'debug' && steps.resolve.outputs.target_abi == 'arm64-v8a' }}
        working-directory: simple_live_app
        run: |
          set -o pipefail
          flutter build apk --debug --target-platform android-arm64 2>&1 | tee build.log

      - name: Build APK (debug / universal)
        if: ${{ steps.resolve.outputs.build_type == 'debug' && steps.resolve.outputs.target_abi == 'universal' }}
        working-directory: simple_live_app
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee build.log

      - name: Build APK (release / arm64)
        if: ${{ steps.resolve.outputs.build_type == 'release' && steps.resolve.outputs.target_abi == 'arm64-v8a' }}
        working-directory: simple_live_app
        run: |
          set -o pipefail
          flutter build apk --release --target-platform android-arm64 2>&1 | tee build.log

      - name: Build APK (release / universal)
        if: ${{ steps.resolve.outputs.build_type == 'release' && steps.resolve.outputs.target_abi == 'universal' }}
        working-directory: simple_live_app
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log

      # ---------- 产物 ----------
      - name: Collect artifacts
        run: |
          mkdir -p dist
          APK=$(ls simple_live_app/build/app/outputs/flutter-apk/*.apk | head -1)
          TYPE=${{ steps.resolve.outputs.build_type }}
          if [ "$TYPE" = "debug" ]; then
            cp "$APK" dist/android-debug.apk
            NAME=android-debug.apk
          else
            cp "$APK" dist/android-release.apk
            NAME=android-release.apk
          fi
          cp simple_live_app/build.log dist/build.log 2>/dev/null || true
          (cd dist && sha256sum "$NAME" > sha256.txt)
          ls -la dist
          cat dist/sha256.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ steps.resolve.outputs.build_type }}-${{ steps.resolve.outputs.target_abi }}-${{ github.run_number }}
          path: |
            dist/*.apk
            dist/sha256.txt
            dist/build.log
          retention-days: 14
          if-no-files-found: error
