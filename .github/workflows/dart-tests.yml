name: dart-tests

# Dart 逻辑测试：核心库 + 局域网服务端（含真实平台集成测试）。
# 手动触发，或推送时自动运行（测试成本低，APK 构建不在此工作流中）。
on:
  workflow_dispatch:
  push:
    branches:
      - lan-server-dev

permissions:
  contents: read

jobs:
  dart-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Core — pub get
        working-directory: simple_live_core
        run: dart pub get

      - name: Core — offline unit tests
        working-directory: simple_live_core
        env:
          LAN_SKIP_DOUYIN: '1'
          LAN_SKIP_DANMAKU_FOR: 'douyu'
        run: |
          # 平台 CDN 对数据中心 IP 的连通性存在波动，整体重试以消除偶发超时
          for i in 1 2 3; do
            dart test --exclude-tags integration && exit 0
            echo "===== retry $i ====="
            sleep 20
          done
          exit 1

      - name: Core — network tests (bilibili/douyu/huya)
        working-directory: simple_live_core
        env:
          LAN_SKIP_DOUYIN: '1'
          LAN_SKIP_DANMAKU_FOR: 'douyu'
        run: |
          for i in 1 2 3; do
            dart test test/simple_live_core_test.dart && exit 0
            echo "===== retry $i ====="
            sleep 20
          done
          exit 1

      - name: LAN server — pub get
        working-directory: simple_live_lan_server
        run: dart pub get

      - name: LAN server — unit tests
        working-directory: simple_live_lan_server
        run: dart test --exclude-tags integration

      - name: LAN server — real platform integration tests (huya/douyu/bilibili)
        working-directory: simple_live_lan_server
        env:
          LAN_INTEGRATION: '1'
          LAN_SKIP_DANMAKU_FOR: 'douyu'
        run: |
          for i in 1 2 3; do
            dart test --tags integration && exit 0
            echo "===== retry $i ====="
            sleep 20
          done
          exit 1

      - name: Console — tests
        working-directory: simple_live_console
        run: |
          dart pub get
          dart test

      - name: Test report
        if: always()
        run: |
          echo "=== Dart tests finished ==="
